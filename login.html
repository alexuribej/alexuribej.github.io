<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Grupo Alfera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #0066cc;
            margin-bottom: 10px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0052a3;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .info {
            background: #f0f4ff;
            border-left: 4px solid #0066cc;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            margin-top: 20px;
            line-height: 1.5;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #0066cc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="logo">🔐</div>
            <h1 class="title">Grupo Alfera</h1>
            <p class="subtitle">Acceso a Fichas Técnicas</p>
        </div>

        <div class="error" id="errorMsg"></div>

        <form id="loginForm" style="display: block;">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="tu.correo@ejemplo.com"
                    required
                    autocomplete="email"
                >
            </div>

            <button type="submit" id="submitBtn">Acceder</button>

            <div class="info">
                💡 Ingresa tu correo corporativo para acceder a la ficha técnica.
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Validando acceso...</p>
        </div>

        <div class="footer">
            Grupo Alfera © 2026 | Acceso Seguro
        </div>
    </div>

    <script>
        // ============================================================
        // FUENTE DE VERDAD: Google Sheet publicado como CSV
        // Para agregar/quitar ejecutivos, edita el Sheet directamente
        // (columna ESTADO = ACTIVO o INACTIVO). No es necesario tocar
        // este archivo nunca más.
        // ============================================================
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQDyQaaEkfcFdRdCrvuSAQxNxT_kx4D_HtEeKkT7Pcj18OcvtbfiW_q9dYIp06gXmvkq385LJLV_a06/pub?gid=0&single=true&output=csv';

        // URL DE REDIRECCIÓN CORRECTA - CAMBIAR SI ES NECESARIO
        const REDIRECT_URL = 'https://alexuribej.github.io/fichas-alfera.html';

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        // Parser CSV simple, tolera comillas y comas dentro de campos
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i + 1];

                if (inQuotes) {
                    if (char === '"' && next === '"') { field += '"'; i++; }
                    else if (char === '"') { inQuotes = false; }
                    else { field += char; }
                } else {
                    if (char === '"') { inQuotes = true; }
                    else if (char === ',') { row.push(field); field = ''; }
                    else if (char === '\n' || char === '\r') {
                        if (char === '\r' && next === '\n') i++;
                        row.push(field);
                        rows.push(row);
                        row = [];
                        field = '';
                    } else {
                        field += char;
                    }
                }
            }
            if (field.length > 0 || row.length > 0) {
                row.push(field);
                rows.push(row);
            }
            return rows.filter(r => r.some(cell => cell.trim() !== ''));
        }

        // Descarga y evalúa el estado de un correo contra el Sheet en vivo
        async function checkEmailStatus(email) {
            const response = await fetch(SHEET_CSV_URL + '&t=' + Date.now(), { cache: 'no-store' });
            if (!response.ok) throw new Error('No se pudo leer la planilla');
            const text = await response.text();
            const rows = parseCSV(text);

            // Se asume: col 0 = NOMBRE, col 1 = CORREO, col 2 = ESTADO
            // Se ignora la primera fila (encabezados)
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i];
                const correo = (cols[1] || '').trim().toLowerCase();
                const estado = (cols[2] || '').trim().toUpperCase();
                if (correo === email) {
                    return estado === 'ACTIVO';
                }
            }
            return false; // correo no encontrado en la planilla
        }

        // Revisar si ya hay sesión activa
        window.addEventListener('load', () => {
            const savedEmail = sessionStorage.getItem('grupoalfera_user');
            if (savedEmail) {
                window.location.href = REDIRECT_URL;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.toLowerCase().trim();

            errorMsg.classList.remove('show');

            if (!email.includes('@')) {
                showError('Por favor ingresa un correo válido.');
                return;
            }

            form.style.display = 'none';
            loading.style.display = 'block';

            try {
                const isActive = await checkEmailStatus(email);
                if (isActive) {
                    sessionStorage.setItem('grupoalfera_user', email);
                    window.location.href = REDIRECT_URL;
                } else {
                    loading.style.display = 'none';
                    form.style.display = 'block';
                    showError('Lo sentimos. Este correo no está autorizado para acceder.');
                    emailInput.focus();
                }
            } catch (err) {
                loading.style.display = 'none';
                form.style.display = 'block';
                showError('No se pudo validar el acceso en este momento. Intenta nuevamente.');
                console.error(err);
            }
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
        }

        emailInput.focus();
    </script>
</body>
</html>
